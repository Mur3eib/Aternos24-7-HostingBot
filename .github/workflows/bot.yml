name: Minecraft AFK Bot

on: 
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

concurrency:
  group: minecraft-afk-bot
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Start Bot with Auto-Restart Loop
        run: |
          while true; do
            node --max-old-space-size=256 index.js || echo "Bot restarted..."
            sleep 5
          done
